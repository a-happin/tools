<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Counter</title>
    <style type="text/css">
    *, *::before, *::after
    {
      margin: 0;
      padding: 0;
      border: 0;
      box-sizing: border-box;
    }

    html,body
    {
      height: 100%;
    }

    button
    {
      font: inherit;
      color: inherit;
    }

    body
    {
      display: grid;
      place-items: center;
      justify-items: center;

      font-family: sans-serif;
      font-weight: 700;
    }

    body > button
    {
      width: 90vmin;
      height: 90vmin;

      outline: 0;

      font-size: 20vmin;

      border-radius: 50%;
      box-shadow: 5px 5px 5px #0004;

      background-color: #7f7f7f10;

      &:is(:hover,:active)
      {
        background-color: #7f7f7f20;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color: #ffffff;
        background-color: #2c2f33;
      }
    }
    </style>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <button id="button">0</button>
  </body>
</html>
