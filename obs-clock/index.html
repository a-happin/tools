<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>OBS Clock</title>
    <style type="text/css">
    *, *::before, *::after
    {
      margin: 0;
      padding: 0;
      border: 0;
      box-sizing: border-box;
    }

    html, body
    {
      height: 100%;
    }

    body
    {
      font-family: "Roboto Mono", monospace;
      font-weight: 700;
      font-feature-settings: "zero";
      font-variant-numeric: slashed-zero;
    }

    @keyframes blinking
    {
      0%,50% { opacity: 1; }
      75%,100% { opacity: 0; }
    }

    @keyframes gradient-animation
    {
      0% { background-position: 0 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    .blink
    {
      animation: blinking 2s linear infinite;
    }

    /* wrap main tag (obs try to draw body) */
    main, .main-grid
    {
      width: 100%;
      height: 100%;

      display: grid;
      place-content: center;
      place-items: center;

      border-radius: 5%;

      color: #ffffff;
      background: linear-gradient(260deg,#d9afd9,#97d9e1);
      background-size: 240%;
      animation: gradient-animation 12s ease infinite;
    }

    #time_view, #date_view
    {
      display: block;
      /* text-shadow: 4px 4px 5px #000000; */
    }

    #time_view
    {
      /* font-size: min(20vw, 200px); */
      /* font-size: 30vw; */
      font-size: 25vw;
      line-height: 0.9em;
    }

    #date_view
    {
      /* font-size: min(6vw, 60px); */
      font-size: 9vw;
      line-height: 0.9em;
    }
    </style>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="time_view"><span id="time_view_hour">--</span><span class="colon">:</span><span id="time_view_min">--</span></div>
    <div id="date_view">----/--/-- ---</div>
  </body>
</html>
